<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Offline — Amnezia Web Panel</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --text: #e8e8ed;
      --muted: #9898a6;
      --grad-a: #8b5cf6;
      --grad-b: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(99, 102, 241, 0.15), transparent),
        var(--bg);
    }
    .card {
      text-align: center;
      max-width: 320px;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 12px 40px rgba(99, 102, 241, 0.35);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    button {
      appearance: none;
      border: none;
      cursor: pointer;
      min-height: 44px;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button:active { opacity: 0.9; transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">⚡</div>
    <h1>You're offline</h1>
    <p>Amnezia Web Panel needs a network connection. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
